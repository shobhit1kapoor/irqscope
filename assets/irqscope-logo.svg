<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">IRQScope</title>
  <desc id="description">Interrupt and peripheral concurrency analysis for IDA.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1119"/>
      <stop offset="1" stop-color="#162838"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75f0d9"/>
      <stop offset="1" stop-color="#41adcf"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#4ad9ca" stop-opacity=".17"/>
      <stop offset="1" stop-color="#4ad9ca" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#a9d5e6" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#background)"/>
  <rect width="1600" height="900" rx="42" fill="url(#grid)"/>
  <circle cx="390" cy="450" r="350" fill="url(#halo)"/>
  <g fill="none" stroke="#6aa7bb" stroke-opacity=".13" stroke-width="2">
    <path d="M0 178H170L226 234H302"/><path d="M0 724H132L186 670H288"/>
    <path d="M1298 156H1410L1470 216H1600"/><path d="M1300 748H1412L1470 690H1600"/>
    <path d="M1070 0V94L1128 152"/><path d="M640 900V824L696 768"/>
  </g>
  <g fill="#8dc9d4" fill-opacity=".34">
    <circle cx="170" cy="178" r="5"/><circle cx="302" cy="234" r="5"/>
    <circle cx="132" cy="724" r="5"/><circle cx="288" cy="670" r="5"/>
    <circle cx="1410" cy="156" r="5"/><circle cx="1470" cy="216" r="5"/>
    <circle cx="1412" cy="748" r="5"/><circle cx="1470" cy="690" r="5"/>
  </g>
  <g transform="translate(390 450)">
    <circle r="236" fill="#101b26" stroke="#315162" stroke-width="2"/>
    <circle r="195" fill="none" stroke="#294858" stroke-width="2" stroke-dasharray="2 12"/>
    <circle r="164" fill="none" stroke="url(#accent)" stroke-opacity=".82" stroke-width="5"/>
    <circle r="116" fill="#101b26" stroke="#496b7a" stroke-opacity=".74" stroke-width="2"/>
    <path d="M-215 0H-162L-130-36L-88 72L-38-96L7 40L40 0H116" fill="none" stroke="#64ead3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="-215" cy="0" r="10" fill="#77f2db"/>
    <circle cx="-162" cy="0" r="8" fill="#77f2db"/>
    <circle cx="116" cy="0" r="10" fill="#77f2db"/>
    <path d="M0-236V-212M0 212V236M-236 0H-212M212 0H236" stroke="#68d9d0" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="740" y="430" fill="#f3f8fb" font-size="112" font-weight="700" letter-spacing="-4">IRQScope</text>
    <path d="M746 482H1268" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <text x="746" y="548" fill="#94afbd" font-size="25" font-weight="600" letter-spacing="5">INTERRUPT · PERIPHERAL ANALYSIS</text>
    <text x="746" y="627" fill="#bfd0d9" font-size="27" font-weight="400">Evidence-linked firmware concurrency triage</text>
  </g>
</svg>
