name: Validate IRQScope

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # v7.1.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"

      - name: Install demo build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes wget gnupg lsb-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 22
          sudo apt-get install --yes clang-22 lld-22 llvm-22

      - name: Compile Python sources
        run: python -m compileall -q irqscope irqscope_plugin.py tests tools

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.15.10"

      - name: Lint Python sources
        run: ruff check irqscope tools tests irqscope_plugin.py

      - name: Run unit suite
        run: python -m unittest discover -s tests -v

      - name: Verify demo firmware artifacts
        run: >-
          python tools/build_demo.py --check
          --clang clang-22
          --llvm-strip llvm-strip-22
          --llvm-objdump llvm-objdump-22

      - name: Build release archive
        run: >-
          python tools/package_release.py
          --github-repository https://github.com/shobhit1kapoor/irqscope
          --author "shobhit kapoor"
          --author-email shobhit1kapoor@gmail.com
          --output-dir dist

      - name: Install HCLI
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/hcli" \
            https://github.com/HexRaysSA/ida-hcli/releases/download/v0.28.0/hcli-linux-x86_64-0.28.0
          echo "d03b8da9c0de6932cdfcdb40a971fee81c28098a881f640ecec26ddb066172c4  $RUNNER_TEMP/hcli" | sha256sum --check
          chmod +x "$RUNNER_TEMP/hcli"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint package with HCLI
        run: hcli plugin lint dist/irqscope-0.1.0.zip
